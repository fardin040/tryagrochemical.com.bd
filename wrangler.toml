name = "try-agrochemical"
workers_dev = true
main = ".open-next/worker.js"
upload_source_maps = true
compatibility_date = "2026-10-20"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "try-agrochemical"
database_id = "a0868c9c-a6cb-4aa1-9922-729ed0c39bdc"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "try-agrochemical-media"
